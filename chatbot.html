<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tense Bot</title>
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <div class="chatbot-container">
        <header>
            <h1>Tense Bot</h1>
            <p id="onboarding-tip">Answer quickly to build streaks and earn milestone rewards.</p>
            <div class="status-grid">
                <p>Remaining: <span id="remaining-count">50</span></p>
                <p>Time Left: <span id="time-left">30</span>s</p>
                <p>Score: <span id="score">0</span></p>
                <p>Streak: <span id="streak">0</span></p>
                <p>Best Streak: <span id="best-streak">0</span></p>
                <p>Difficulty: <span id="difficulty">1.00x</span></p>
            </div>
            <div class="json-helper">
                <p class="helper-title">JSON Question Helper</p>
                <div class="helper-actions">
                    <select id="helper-level" aria-label="Question level" title="Question level">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                    <input type="number" id="helper-count" min="1" max="20" value="5" aria-label="Number of questions" title="Number of questions" placeholder="Count">
                    <button id="generate-json-btn">Generate JSON</button>
                    <button id="copy-json-btn">Copy JSON</button>
                </div>
                <textarea id="json-output" rows="8" readonly placeholder="AI-generated JSON questions will appear here..."></textarea>
            </div>
        </header>
        <main>
            <div class="chat-container">
                <div id="chat-window" class="chat-window"></div>
                <div class="input-container">
                    <input type="text" id="user-answer" placeholder="Enter your answer here">
                    <button id="submit-btn">Submit</button>
                    <button id="hint-btn">Hint</button>
                    <button id="next-btn">Next</button>
                    <button id="restart-btn">Restart</button>
                </div>
            </div>
            
        </main>
    </div>
    <script src="chatbot.js"></script>
</body>
</html>
